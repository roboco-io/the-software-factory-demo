name: factory-smoke
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      api_base:
        description: 검증용 실패 주입에만 쓴다. 프로덕션 API(https://sfd-api.<WORKERS_SUBDOMAIN>.workers.dev/api) 자신이나 그 하위 경로만 허용한다. 비우면 프로덕션 API를 검사한다.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: factory-smoke
  cancel-in-progress: false
jobs:
  target:
    # 실패 주입용 api_base는 프로덕션 API 호스트 아래 경로만 받는다. 다른 호스트를 검사하거나 스모크 이슈에 임의 URL을 싣지 못하게 한다.
    # 이 job이 실패하면 report도 실행되지 않는다(잘못된 입력을 스모크 실패로 기록하지 않는다).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROD_API: https://sfd-api.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev/api
    steps:
      - name: api_base가 프로덕션 API 밖이면 거부
        if: ${{ inputs.api_base != '' && inputs.api_base != env.PROD_API && !startsWith(inputs.api_base, format('{0}/', env.PROD_API)) }}
        run: exit 1
  checks:
    # 프로덕션에 읽기 요청만 보낸다(spec 7.1.3). 시크릿과 GitHub App 토큰을 받지 않는다.
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      excerpt-artifact-id: ${{ steps.excerpt-upload.outputs.artifact-id }}
    env:
      API_BASE: ${{ inputs.api_base || format('https://sfd-api.{0}.workers.dev/api', vars.WORKERS_SUBDOMAIN) }}
      E2E_BASE_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: gacts/install-hurl@v1
      # 출력은 로그와 파일 양쪽에 남긴다. pipefail로 tee가 실패를 성공으로 바꾸지 않게 한다.
      - name: API 읽기 전용 스모크(Hurl)
        id: hurl
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          hurl --test --variable "api=$API_BASE" tests/smoke/readonly.hurl 2>&1 | tee "$RUNNER_TEMP/smoke/hurl.log"
      # Hurl이 실패해도 웹 스모크까지 실행해 실패 범위를 한 run에서 보이게 한다.
      - if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 웹 읽기 전용 스모크(Playwright)
        id: web
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          pnpm --filter web exec playwright test -c e2e-smoke/playwright.config.ts 2>&1 | tee "$RUNNER_TEMP/smoke/web.log"
      # 실패한 쪽 출력의 끝부분(각 40줄, 전체 6000바이트 이내)만 report에 넘긴다. 이슈 본문과 주간 리포트의 원문이 된다.
      - name: 실패 원문 발췌
        id: excerpt
        if: ${{ !cancelled() }}
        env:
          HURL_OUTCOME: ${{ steps.hurl.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          {
            if [ "$HURL_OUTCOME" = failure ] && [ -s "$dir/hurl.log" ]; then
              echo "== Hurl (tests/smoke/readonly.hurl) =="
              tail -n 40 "$dir/hurl.log"
            fi
            if [ "$WEB_OUTCOME" = failure ] && [ -s "$dir/web.log" ]; then
              echo "== Playwright (apps/web/e2e-smoke) =="
              tail -n 40 "$dir/web.log"
            fi
          } | head -c 6000 > "$dir/smoke-excerpt.txt"
          if [ -s "$dir/smoke-excerpt.txt" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - id: excerpt-upload
        if: ${{ !cancelled() && steps.excerpt.outputs.found == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-excerpt
          path: ${{ runner.temp }}/smoke/smoke-excerpt.txt
          retention-days: 7
  report:
    needs: [target, checks]
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 실패 원문 발췌가 없으면(성공, 또는 checks가 취소·시간 초과) 내려받지 않고 원문 없이 보고한다.
      - if: ${{ needs.checks.outputs.excerpt-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.checks.outputs.excerpt-artifact-id }}
          path: ${{ runner.temp }}/smoke-in
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      # 수동 실행(api_base 실패 주입 포함)은 검증 대상이 불확실하므로 정기 실행(schedule)의 성공만 기준으로 삼는다.
      # 새 스모크 이슈에 "마지막 성공 이후 배포된 PR"을 적기 위한 기준 시각. 조회가 실패해도 보고는 해야 하므로 빈 값으로 넘긴다.
      - id: last-success
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ts=$(gh run list --workflow factory-smoke.yml --branch main --event schedule --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""' 2>/dev/null) || ts=""
          echo "value=$ts" >> "$GITHUB_OUTPUT"
      # F6: checks가 취소·시간 초과로 끝나도 실패로 넘긴다. 스모크 실패가 이슈 없이 사라지지 않게 한다.
      - run: pnpm -s factory smoke-report --result "$RESULT" --excerpt-file "$RUNNER_TEMP/smoke-in/smoke-excerpt.txt" --last-success "$LAST_SUCCESS"
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_BOT_USER_ID: ${{ vars.FACTORY_BOT_USER_ID }}
          RESULT: ${{ needs.checks.result == 'success' && 'success' || 'failure' }}
          SMOKE_API_BASE: ${{ inputs.api_base }}
          LAST_SUCCESS: ${{ steps.last-success.outputs.value }}
