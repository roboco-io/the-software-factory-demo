name: factory-weekly
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      issue:
        description: 이 이슈(포스트모템이 개선 후보를 남긴 장애 이슈)로 improve만 실행한다. 비우면 주간 리포트부터 실행한다.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: factory-weekly
  cancel-in-progress: false
env:
  FACTORY_BOT_USER_ID: ${{ vars.FACTORY_BOT_USER_ID }}
  FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}
  FACTORY_DAILY_LIMIT: ${{ vars.FACTORY_DAILY_LIMIT }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  CODEX_MODEL: ${{ vars.CODEX_MODEL }}
  PI_MODEL: ${{ vars.PI_MODEL }}
  WEB_URL: ${{ vars.WEB_URL }}
  WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
jobs:
  # 팩토리 CLI는 항상 main을 체크아웃한 runtime 디렉토리에서 실행한다. work는 에이전트가 고치는 작업 트리다.
  # report가 주간 리포트 이슈를 만들고, 개선 후보가 있을 때만 prepare 이후 단계가 돈다.
  report:
    # issue 입력이 있으면 리포트를 만들지 않고 그 이슈로 improve를 바로 실행한다.
    if: ${{ inputs.issue == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      issue: ${{ steps.report.outputs.issue }}
      candidates: ${{ steps.report.outputs.candidates }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, path: runtime, persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: runtime/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: runtime
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - id: report
        working-directory: runtime
        run: |
          pnpm -s factory weekly-report > "$RUNNER_TEMP/weekly.json"
          jq -r '"issue=\(.issue)", "candidates=\(.candidates)"' "$RUNNER_TEMP/weekly.json" >> "$GITHUB_OUTPUT"
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
  prepare:
    needs: report
    # report가 건너뛰어져도(issue 입력) 이어 간다. report가 실패하거나 취소되면 이어 가지 않는다.
    if: ${{ !cancelled() && (needs.report.result == 'success' || needs.report.result == 'skipped') && (inputs.issue != '' || needs.report.outputs.candidates != '0') }}
    env:
      ISSUE: ${{ inputs.issue || needs.report.outputs.issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-plan: ${{ steps.prepare.outputs.has-plan }}
      engine: ${{ steps.prepare.outputs.engine }}
      plan-artifact-id: ${{ steps.plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, path: runtime, persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: runtime/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: runtime
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - id: prepare
        working-directory: runtime
        run: |
          pnpm -s factory improve --issue "$ISSUE" --phase prepare --state "$RUNNER_TEMP/plan.json"
          jq -r '"has-plan=\(.plan != null)", "engine=\(.plan.engine // "")"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
      - id: plan
        uses: actions/upload-artifact@v7
        with:
          name: factory-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 7
  agent:
    needs: [report, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has-plan == 'true' }}
    runs-on: ubuntu-latest
    # implement agent와 같은 상한을 둔다.
    timeout-minutes: 75
    env:
      ISSUE: ${{ inputs.issue || needs.report.outputs.issue }}
    # GitHub App 토큰, Cloudflare 시크릿이 없다. 공개 리포 체크아웃에 필요한 읽기 권한만 둔다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, path: runtime, persist-credentials: false }
      - uses: actions/checkout@v7
        with: { ref: main, path: work, fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: runtime/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: runtime
      - run: pnpm install --frozen-lockfile
        working-directory: work
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/in
      # Codex CLI의 Linux 샌드박스(bubblewrap)는 비특권 user namespace가 필요하다.
      # ubuntu-24.04 러너는 AppArmor가 이를 막아 쓰기·명령 실행이 조용히 실패하므로 해제한다.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: agent (GitHub 토큰 없음, 배정된 엔진의 키만 있음)
        working-directory: runtime
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          pnpm -s factory improve --issue "$ISSUE" --phase agent --state "$RUNNER_TEMP/in/plan.json" --outcome "$RUNNER_TEMP/out/outcome.json"
        env:
          FACTORY_WORKDIR: ${{ github.workspace }}/work
          FACTORY_BUNDLE: ${{ runner.temp }}/out/work.bundle
          ANTHROPIC_API_KEY: ${{ needs.prepare.outputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_API_KEY: ${{ needs.prepare.outputs.engine == 'codex' && secrets.CODEX_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ needs.prepare.outputs.engine == 'pi' && secrets.DEEPSEEK_API_KEY || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-outcome
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [report, prepare, agent]
    # 취소(@factory stop)된 run은 publish하지 않는다. agent job 실패·시간 초과는 publish가 crashed()로 처리한다.
    if: ${{ !cancelled() && needs.prepare.outputs.has-plan == 'true' && needs.agent.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE: ${{ inputs.issue || needs.report.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, path: runtime, persist-credentials: false }
      # 번들을 가져올 작업 트리다. 여기 있는 코드는 실행하지 않는다.
      - uses: actions/checkout@v7
        with: { ref: main, path: work, fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: runtime/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: runtime
      # 계획은 prepare job이 올린 artifact(ID 고정)에서만 읽는다.
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: factory-outcome
          path: ${{ runner.temp }}/out
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - working-directory: runtime
        run: pnpm -s factory improve --issue "$ISSUE" --phase publish --state "$RUNNER_TEMP/in/plan.json" --outcome "$RUNNER_TEMP/out/outcome.json"
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_WORKDIR: ${{ github.workspace }}/work
          FACTORY_BUNDLE: ${{ runner.temp }}/out/work.bundle
