name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  API_URL: https://sfd-api.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
jobs:
  api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sfd-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # INTAKE_TOKEN의 원본은 production environment secret이다. 배포마다 같은 값을 Worker secret으로 넣는다(값은 stdin으로만 전달).
      # F5: deploy보다 먼저 실행한다. secret이 비어 있으면 API를 배포하기 전에 job이 실패한다(부분 배포 방지). secret은 이후 deploy에도 유지된다.
      - name: Sync INTAKE_TOKEN Worker secret
        working-directory: apps/api
        run: |
          test -n "$INTAKE_TOKEN"
          printf '%s' "$INTAKE_TOKEN" | pnpm exec wrangler secret put INTAKE_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
      # BOOK_SYNC_TOKEN: 책 저장소 배포가 POST /api/book/sync를 부를 때 쓰는 토큰. INTAKE_TOKEN과 같은 방식으로 넣는다.
      - name: Sync BOOK_SYNC_TOKEN Worker secret
        working-directory: apps/api
        run: |
          test -n "$BOOK_SYNC_TOKEN"
          printf '%s' "$BOOK_SYNC_TOKEN" | pnpm exec wrangler secret put BOOK_SYNC_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOK_SYNC_TOKEN: ${{ secrets.BOOK_SYNC_TOKEN }}
      # --outdir: 배포되는 번들을 파일로 남긴다. provenance job이 이 파일을 증명(attest)한다.
      - working-directory: apps/api
        run: pnpm exec wrangler deploy --outdir dist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: worker-bundle
          path: apps/api/dist-worker
          if-no-files-found: error
  web:
    needs: api
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
        env:
          VITE_API_BASE: ${{ env.API_URL }}/api
          VITE_BUILD_SHA: ${{ github.sha }}
      # 게시하는 dist와 같은 파일을 올린다. provenance job이 이 산출물을 증명한다.
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/web/dist
          keep_files: true
  smoke:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: API health
        run: curl -fsS --retry 5 --retry-delay 5 "$API_URL/api/health"
      - name: API topics
        run: curl -fsS "$API_URL/api/topics?limit=1" | grep -q '"topicsCount"'
      - name: Web index (Pages 반영 대기 최대 5분)
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.WEB_URL }}" | grep -qF "content=\"${{ github.sha }}\"" && exit 0
            sleep 10
          done
          exit 1
      # 새 빌드가 반영된 뒤 factory-smoke와 같은 읽기 전용 Playwright 스모크를 실행한다. 실패하면 smoke job이 실패해 factory-report가 deploy-failed를 처리한다.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 웹 읽기 전용 스모크(Playwright)
        run: pnpm --filter web exec playwright test -c e2e-smoke/playwright.config.ts
        env:
          E2E_BASE_URL: ${{ vars.WEB_URL }}
  provenance:
    # 배포한 산출물의 빌드 출처와 SBOM을 증명한다. factory-report는 이 job에 의존하지 않는다:
    # 증명이 실패해도 눈에 보이지만 프로덕션 장애로 보고하지 않는다.
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          name: worker-bundle
          path: worker-bundle
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - name: web-dist.tgz 만들기
        run: tar -czf web-dist.tgz -C web-dist .
      - uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: worker-bundle/*
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: web-dist.tgz
      - uses: actions/attest-sbom@v4
        with:
          subject-path: worker-bundle/*
          sbom-path: sbom.spdx.json
      - uses: actions/attest-sbom@v4
        with:
          subject-path: web-dist.tgz
          sbom-path: sbom.spdx.json
  factory-report:
    # 배포·스모크 결과를 해당 커밋의 팩토리 이슈에 반영한다. Cloudflare 시크릿과 environment는 쓰지 않는다.
    # 연속 병합으로 대기 중이던 deploy run이 취소되면 그 커밋의 이슈는 merged에 남는다(docs/operations.md 런북 참고).
    needs: [api, web, smoke]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: 팩토리 이슈에 배포 결과 반영
        run: |
          if [ "$SMOKE" = "success" ]; then pnpm -s factory deployed --sha "$GITHUB_SHA"; else pnpm -s factory deploy-failed --sha "$GITHUB_SHA"; fi
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
          SMOKE: ${{ needs.smoke.result }}
