name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  forum-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: gacts/install-hurl@v1
      - run: scripts/forum-api.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }
  risk-tier:
    # 브랜치 보호 필수 체크다. PR 브랜치의 packages/factory로 판정하면 봇 PR이 판정 코드를 고쳐
    # T3 검사를 피할 수 있으므로, base 커밋을 별도 디렉토리(base)에 체크아웃해 그 코드와 정책으로 판정한다.
    # 변경 파일 목록은 API로 읽으므로 PR 코드는 체크아웃하지 않는다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - working-directory: base
        run: pnpm -s factory risk --pr "$PR" --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
  evidence-plan:
    # 버그 PR인지, PR이 추가·수정한 테스트 파일이 무엇인지 base 커밋의 팩토리 코드로 정한다(spec 7.1.2).
    # 변경 파일과 이슈 라벨은 API로 읽으므로 PR 코드는 체크아웃하지 않는다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - id: plan
        working-directory: base
        run: |
          pnpm -s factory evidence --pr "$PR" --sha "$HEAD_SHA" --base "$BASE_SHA" --json > "$RUNNER_TEMP/evidence.json"
          echo "plan=$(jq -c . "$RUNNER_TEMP/evidence.json")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  evidence:
    # 필수 체크. PR 코드(테스트)를 실행하므로 시크릿·GitHub 토큰을 주지 않는다. 판정은 base 커밋의 CLI가 한다.
    # evidence-plan이 실패해도 건너뛰지 않는다. 건너뛴(skipped) 필수 체크는 통과로 취급되기 때문이다.
    # 계획이 없으면 evidence-run이 EvidencePlanSchema 검증에서 실패로 끝난다.
    needs: evidence-plan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      # base 커밋 객체가 필요하므로 전체 이력을 받는다(git worktree로 base 트리를 만든다).
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            path: head,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - name: evidence (시크릿·GitHub 토큰 없음)
        working-directory: base
        run: pnpm -s factory evidence-run
        env:
          EVIDENCE_PLAN: ${{ needs.evidence-plan.outputs.plan }}
          FACTORY_WORKDIR: ${{ github.workspace }}/head
  # 자기개선 PR의 평가 케이스 판정 계획(spec 7.2.4). 토큰으로 PR 작성자와 메타만 읽고 PR 코드는 실행하지 않는다.
  eval-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - id: plan
        working-directory: base
        run: |
          pnpm -s factory eval --pr "$PR" --sha "$HEAD_SHA" --base "$BASE_SHA" --json > "$RUNNER_TEMP/eval.json"
          echo "plan=$(jq -c . "$RUNNER_TEMP/eval.json")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # 평가 케이스 판정. head의 ESLint 설정(PR 코드)을 실행하므로 시크릿·토큰이 없다.
  eval:
    needs: eval-plan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            path: head,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - name: eval (시크릿·GitHub 토큰 없음)
        working-directory: base
        run: pnpm -s factory eval-run
        env:
          EVAL_PLAN: ${{ needs.eval-plan.outputs.plan }}
          EVAL_BASE_DIR: ${{ github.workspace }}/base
          FACTORY_WORKDIR: ${{ github.workspace }}/head
  # 보안 검사 3종(SDLC 보안 통제). 필수 체크이며 실패를 무시하는 단계가 없다(fail-closed).
  # SAST. CodeQL analyze는 탐지 결과가 있어도 성공하므로 sarif-gate가 심각도 7.0 이상 결과로 작업을 실패시킨다.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node scripts/sarif-gate.mjs sarif-results
  # 의존성 취약점 검사. 개발 의존성도 시크릿이 있는 CI에서 실행되므로 전체를 검사한다.
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm audit --audit-level=high
  # 시크릿 검사. gitleaks-action은 조직 계정에서 유료 라이선스가 필요하므로 CLI 컨테이너 이미지를 쓴다.
  # PR은 base..head, push는 before..sha 범위의 모든 커밋을 검사한다(before가 전부 0이면 HEAD 커밋만).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.head.sha || github.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - name: gitleaks (PR 범위)
        if: github.event_name == 'pull_request'
        run: docker run --rm -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --config factory/security/gitleaks.toml --redact --exit-code 1 --log-opts "$RANGE" /repo
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: gitleaks (push 범위)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: docker run --rm -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --config factory/security/gitleaks.toml --redact --exit-code 1 --log-opts "$RANGE" /repo
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
      - name: gitleaks (새 브랜치 push, HEAD만)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: docker run --rm -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --config factory/security/gitleaks.toml --redact --exit-code 1 --log-opts "-1" /repo
