name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  realworld-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: gacts/install-hurl@v1
      - run: scripts/realworld-api.sh
  forum-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: gacts/install-hurl@v1
      - run: scripts/forum-api.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }
  risk-tier:
    # 브랜치 보호 필수 체크다. PR 브랜치의 packages/factory로 판정하면 봇 PR이 판정 코드를 고쳐
    # T3 검사를 피할 수 있으므로, base 커밋을 별도 디렉토리(base)에 체크아웃해 그 코드와 정책으로 판정한다.
    # 변경 파일 목록은 API로 읽으므로 PR 코드는 체크아웃하지 않는다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - working-directory: base
        run: pnpm -s factory risk --pr "$PR" --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
  evidence-plan:
    # 버그 PR인지, PR이 추가·수정한 테스트 파일이 무엇인지 base 커밋의 팩토리 코드로 정한다(spec 7.1.2).
    # 변경 파일과 이슈 라벨은 API로 읽으므로 PR 코드는 체크아웃하지 않는다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - id: plan
        working-directory: base
        run: |
          pnpm -s factory evidence --pr "$PR" --sha "$HEAD_SHA" --base "$BASE_SHA" --json > "$RUNNER_TEMP/evidence.json"
          echo "plan=$(jq -c . "$RUNNER_TEMP/evidence.json")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  evidence:
    # 필수 체크. PR 코드(테스트)를 실행하므로 시크릿·GitHub 토큰을 주지 않는다. 판정은 base 커밋의 CLI가 한다.
    # evidence-plan이 실패해도 건너뛰지 않는다. 건너뛴(skipped) 필수 체크는 통과로 취급되기 때문이다.
    # 계획이 없으면 evidence-run이 EvidencePlanSchema 검증에서 실패로 끝난다.
    needs: evidence-plan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      # base 커밋 객체가 필요하므로 전체 이력을 받는다(git worktree로 base 트리를 만든다).
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            path: head,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - name: evidence (시크릿·GitHub 토큰 없음)
        working-directory: base
        run: pnpm -s factory evidence-run
        env:
          EVIDENCE_PLAN: ${{ needs.evidence-plan.outputs.plan }}
          FACTORY_WORKDIR: ${{ github.workspace }}/head
  # 자기개선 PR의 평가 케이스 판정 계획(spec 7.2.4). 토큰으로 PR 작성자와 메타만 읽고 PR 코드는 실행하지 않는다.
  eval-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - id: plan
        working-directory: base
        run: |
          pnpm -s factory eval --pr "$PR" --sha "$HEAD_SHA" --base "$BASE_SHA" --json > "$RUNNER_TEMP/eval.json"
          echo "plan=$(jq -c . "$RUNNER_TEMP/eval.json")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # 평가 케이스 판정. head의 ESLint 설정(PR 코드)을 실행하므로 시크릿·토큰이 없다.
  eval:
    needs: eval-plan
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            path: head,
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - name: eval (시크릿·GitHub 토큰 없음)
        working-directory: base
        run: pnpm -s factory eval-run
        env:
          EVAL_PLAN: ${{ needs.eval-plan.outputs.plan }}
          EVAL_BASE_DIR: ${{ github.workspace }}/base
          FACTORY_WORKDIR: ${{ github.workspace }}/head
