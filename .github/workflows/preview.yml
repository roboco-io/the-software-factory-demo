name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  PR: ${{ github.event.pull_request.number }}
  API_URL: https://sfd-api-pr-${{ github.event.pull_request.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
  WEB_PREVIEW_URL: ${{ vars.WEB_URL }}pr-preview/pr-${{ github.event.pull_request.number }}/
jobs:
  policy:
    # 봇 PR이 T2·T3 경로를 바꾸면 사람 승인 전에 에이전트가 쓴 코드가 Cloudflare 토큰과 함께 실행되지 않도록 프리뷰를 만들지 않는다.
    # 판정은 base 커밋의 팩토리 코드와 정책으로 한다(PR이 판정 코드를 고쳐 우회하지 못하게).
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.risk.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          {
            ref: "${{ github.event.pull_request.base.sha }}",
            path: base,
            persist-credentials: false,
          }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: base/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: base/.nvmrc
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: base
      # 판정이 실패하거나 PR head가 이벤트의 SHA에서 바뀌었으면 배포하지 않는다.
      - id: risk
        working-directory: base
        run: |
          pnpm -s factory risk --pr "$PR" --sha "$HEAD_SHA" --json > "$RUNNER_TEMP/risk.json"
          jq -r '"allowed=\(.previewAllowed)", "stale=\(.stale)"' "$RUNNER_TEMP/risk.json" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 이 이벤트의 head SHA다. 판정 시점에 PR head가 바뀌었으면 previewAllowed=false로 배포하지 않는다.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # head가 바뀐 경우(stale)는 새 push의 preview run이 다시 판정하므로 코멘트를 남기지 않는다.
      - if: steps.risk.outputs.allowed != 'true' && steps.risk.outputs.stale != 'true'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: api-preview
          message: |
            **프리뷰 생략:** 팩토리 봇 PR이 T2 이상 경로를 바꿨다. 사람(CODEOWNERS) 승인 전에는 에이전트가 쓴 코드를 Cloudflare 토큰과 함께 실행하지 않는다.
  deploy:
    needs: policy
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.policy.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment: preview
    # pr-preview-action이 gh-pages에 푸시하고 PR에 코멘트를 쓰는 데 필요한 권한만 둔다.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Ensure PR database
        working-directory: apps/api
        run: |
          id() { pnpm exec wrangler d1 list --json | jq -r --arg n "sfd-pr-$PR" '.[] | select(.name==$n) | .uuid'; }
          DB_ID="$(id)"
          if [ -z "$DB_ID" ]; then pnpm exec wrangler d1 create "sfd-pr-$PR"; DB_ID="$(id)"; fi
          test -n "$DB_ID"
          node ../../scripts/preview-config.mjs --pr "$PR" --db-id "$DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Migrate and deploy API
        working-directory: apps/api
        run: |
          pnpm exec wrangler d1 migrations apply "sfd-pr-$PR" --remote -c wrangler.preview.json
          pnpm exec wrangler deploy -c wrangler.preview.json
          printf '%s' "pr-$PR" | openssl dgst -sha256 -hmac "$JWT_SECRET_PREVIEW" -binary | base64 | pnpm exec wrangler secret put JWT_SECRET -c wrangler.preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET_PREVIEW: ${{ secrets.JWT_SECRET_PREVIEW }}
      - name: Build web
        run: pnpm --filter web build
        env:
          VITE_API_BASE: ${{ env.API_URL }}/api
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          wait-for-pages-deployment: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: api-preview
          message: |
            **API preview:** ${{ env.API_URL }}/api/health
            **Web preview:** ${{ env.WEB_PREVIEW_URL }}
  e2e-preview:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Confirm preview reachable (최대 5분)
        run: |
          for i in $(seq 1 30); do curl -fsS "$WEB_PREVIEW_URL" | grep -qF "content=\"$HEAD_SHA\"" && exit 0; sleep 10; done
          exit 1
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: pnpm --filter web e2e
        env:
          E2E_BASE_URL: ${{ env.WEB_PREVIEW_URL }}
  smoke-preview:
    # 프로덕션 읽기 전용 스모크를 PR 프리뷰에 먼저 돌린다. 실패하면 gate가 병합 대신 사람에게 넘긴다.
    # 스모크 파일은 T3라 구현 에이전트 PR에서는 main과 같다(risk-tier).
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Confirm preview reachable (최대 5분)
        run: |
          for i in $(seq 1 30); do curl -fsS "$WEB_PREVIEW_URL" | grep -qF "content=\"$HEAD_SHA\"" && exit 0; sleep 10; done
          exit 1
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: gacts/install-hurl@v1
      - name: API 읽기 전용 스모크(Hurl)
        run: hurl --test --variable "api=$API_URL/api" tests/smoke/readonly.hurl
      - if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 웹 읽기 전용 스모크(Playwright)
        if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright test -c e2e-smoke/playwright.config.ts
        env:
          E2E_BASE_URL: ${{ env.WEB_PREVIEW_URL }}
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment: preview
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Delete preview Worker
        run: |
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sfd-api-pr-$PR?force=true" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || echo "worker already gone"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Delete preview database
        working-directory: apps/api
        run: pnpm exec wrangler d1 delete "sfd-pr-$PR" -y || echo "database already gone"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          action: remove
          token: ${{ secrets.GITHUB_TOKEN }}
